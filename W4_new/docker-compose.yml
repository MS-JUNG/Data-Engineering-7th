version: "3.8"

services:
  spark-master:
    build: .
    container_name: spark-master
    hostname: spark-master
    command: >
      /bin/bash -lc "/opt/spark/sbin/start-master.sh -h spark-master
      && tail -F /opt/spark/logs/spark--org.apache.spark.deploy.master.Master-*.out"
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./data:/data
      - ./output:/output
      - ./scripts:/scripts
      - ./jobs:/jobs

  spark-worker-1:
    build: .
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    command: >
      /bin/bash -lc "/opt/spark/sbin/start-worker.sh spark://spark-master:7077
      && tail -F /opt/spark/logs/spark--org.apache.spark.deploy.worker.Worker-*.out"
    ports:
      - "8081:8081"
    volumes:
      - ./data:/data
      - ./output:/output
      - ./scripts:/scripts
      - ./jobs:/jobs

  spark-worker-2:
    build: .
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    command: >
      /bin/bash -lc "/opt/spark/sbin/start-worker.sh spark://spark-master:7077
      && tail -F /opt/spark/logs/spark--org.apache.spark.deploy.worker.Worker-*.out"
    ports:
      - "8082:8081"
    volumes:
      - ./data:/data
      - ./output:/output
      - ./scripts:/scripts
      - ./jobs:/jobs
